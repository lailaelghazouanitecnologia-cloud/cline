[package]
name = "agent-persist"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["fs", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
