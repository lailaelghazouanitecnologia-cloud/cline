[workspace]
members = [
    "common",
    "protocol",
    "config",
    "tools",
    "exec",
    "core",
    "client",
    "mcp",
    "sandbox",
    "prompts",
    "persist",
    "hooks",
    "context",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
agent-common = { path = "common" }
agent-protocol = { path = "protocol" }
agent-config = { path = "config" }
agent-tools = { path = "tools" }
agent-exec = { path = "exec" }
agent-core = { path = "core" }
agent-client = { path = "client" }
agent-mcp = { path = "mcp" }
agent-sandbox = { path = "sandbox" }
agent-prompts = { path = "prompts" }
agent-persist = { path = "persist" }
agent-hooks = { path = "hooks" }
agent-context = { path = "context" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
async-channel = "2.3"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.9"
pin-project-lite = "0.2"
